<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Eventos 🎉</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f0ff;
      margin: 0;
      text-align: center;
      color: #333;
    }

    header {
      background: #7b2cff;
      color: white;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 35px;
    }

    header p {
      font-size: 18px;
    }

    .eventos {
      padding: 25px;
    }

    .evento {
      background: white;
      margin: 20px auto;
      padding: 20px;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 4px 12px #0002;
    }

    .evento h2 {
      color: #7b2cff;
    }

    .botao {
      display: inline-block;
      background: #7b2cff;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 10px;
    }

    .botao:hover {
      background: #5c16cc;
    }
  </style>
</head>

<body>

  <header>
    <h1>Vibe Eventos 🎉</h1>
    <p>Encontre os melhores eventos!</p>
  </header>

  <section class="eventos">

    <div class="evento">
      <h2>🎶 Festa Vibe</h2>
      <p>📅 30 de Agosto</p>
      <p>📍 Teresina - PI</p>
      <a href="#" class="botao">Participar</a>
    </div>

    <div class="evento">
      <h2>🎤 Festival de Música</h2>
      <p>📅 15 de Setembro</p>
      <p>📍 Teresina - PI</p>
      <a href="#" class="botao">Participar</a>
    </div>

  </section>

</body>
</html>
